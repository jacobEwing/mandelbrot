<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<title>Mandelbrot Explorer</title>
	<link rel="icon" type="image" href="mandelbrot.ico" />
	<link rel="stylesheet" href="libs/valueAdjuster.css?v=1.5"/>
	<link rel="stylesheet" href="mandelbrot.css?v=1.5"/>
	<script type="text/javascript" src="libs/valueAdjuster.js?v=1.5"></script>
	<script type="text/javascript" src="mandelbrot.js?v=1.5"></script>
</head>
<body>
	<div class="app" id="app">

		<!-- Top Bar -->
		<header class="topbar">
			<div class="brand">
				<img src="HeaderIcon.png"/>
				Mandelbrot Explorer
			</div>
			<div class="actions">
				<button class="btn" id="saveBtn">Save</button>
				<button class="btn" id="loadDefaultsBtn">Load Defaults</button>
				<button class="btn" id="showIntroBtn">Help</button>
				<button class="btn" id="urlBtn">Get URL</button>
				<button class="btn" id="exportBtn">Download</button>
				<a class="btn btn-primary" href="//weirdly.net">Weirdly.net</a>
			</div>
		</header>

		<!-- Main -->
		<div class="main">

			<!-- Canvas -->
			<div class="canvas-area" id="canvasArea">
				<canvas id="mainCanvas"></canvas>
			</div>

			<!-- Sidebar -->
			<aside class="sidebar" id="sidebar">
				<div class="sidebar-scroll" id="sidebarScroll">

					<!-- Parameters -->
					<div class="section" data-section="params" id="mainParams">
						<div class="section-header" data-toggle>
							<span>Parameters</span>
							<span class="chevron">▾</span>
						</div>
						<div class="section-body open">
							<div class="field-row">
								<label>X</label>
								<input type="number" id="xOffset" step="any" tabindex="1" />
							</div>
							<div class="field-row">
								<label>Y</label>
								<input type="number" id="yOffset" step="any" tabindex="2" />
							</div>
							<div class="field-row">
								<label>Scale</label>
								<input type="number" id="width" step="any" tabindex="3" />
							</div>
							<div class="field-row">
								<label>Iterations</label>
								<div class="inline-group">
									<input type="number" id="accuracy" step="1" min="1" tabindex="4" />
									<button class="multiplier-btn" data-multiply="2" title="×2">×2</button>
									<button class="multiplier-btn" data-multiply="0.5" title="÷2">÷2</button>
								</div>
							</div>
							<div class="field-row">
								<label>Count Offset</label>
								<input type="number" id="countOffset" step="1" tabindex="5" />
								<input type="number" id="countOffsetDisplay" class="value-adjuster-display" step="any" />
							</div>
							<div class="field-row">
								<div class="btn-block">
									<button class="btn" id="resetViewBtn" title="Reset view">Reset</button>
								</div>
							</div>
						</div>
					</div>

					<!-- Modifiers -->
					<div class="section" data-section="modifiers">
						<div class="section-header" data-toggle>
							<span>Modifiers</span>
							<span class="chevron">▾</span>
						</div>
						<div class="section-body open">
							<div class="tab-bar" id="modifierTabs">
								<button class="tab-btn active" data-tab="calc">Calculation</button>
								<button class="tab-btn" data-tab="end">End Condition</button>
								<button class="tab-btn" data-tab="other">Other</button>
							</div>

							<!-- Calculation -->
							<div class="tab-pane active" id="tab-calc">
								<div class="check-grid">
									<label class="check-group col-left">
										<input type="checkbox" id="calculationIterations" checked />
										Iterations
										<input type="number" class="coeff-input" id="iterationCoefficient" value="1" />
									</label>
									<label class="check-group col-left">
										<input type="checkbox" id="calculationDisplacement" />
										Displacement
										<input type="number" class="coeff-input" id="displacementCoefficient" value="1" />
									</label>
									<label class="check-group col-left">
										<input type="checkbox" id="calculationRotation" />
										Rotation
										<input type="number" class="coeff-input" id="rotationCoefficient" value="1" />
									</label>
									<label class="check-group col-right">
										<input type="checkbox" id="calculationXORDisplacement" />
										XOR Disp.
										<input type="number" class="coeff-input" id="displacementXORCoefficient" value="1" />
									</label>
									<label class="check-group col-right">
										<input type="checkbox" id="calculationXORPolar" />
										XOR Polar
										<input type="number" class="coeff-input" id="polarCoordXORCoefficient" value="1" />
									</label>
									<label class="check-group"></label>
								</div>
							</div>

							<!-- End Condition -->
							<div class="tab-pane" id="tab-end">
								<div style="display:grid;grid-template-columns:1fr 1fr;gap:0.1rem 0.5rem;">
									<label class="check-group"><input type="radio" name="endCondition" value="addition" checked /> Addition (z²+zi²)</label>
									<label class="check-group"><input type="radio" name="endCondition" value="subtraction" /> Subtraction</label>
									<label class="check-group"><input type="radio" name="endCondition" value="multiplication" /> Multiplication</label>
									<label class="check-group"><input type="radio" name="endCondition" value="fluffyCloud" /> Fluffy Cloud</label>
									<label class="check-group" style="grid-column:1/3;"><input type="radio" name="endCondition" value="foliage" /> Foliage</label>
								</div>
							</div>

							<!-- Other: Max Radius + Recursion -->
							<div class="tab-pane" id="tab-other">
								<div class="field-row">
									<label>Max Radius</label>
									<input type="number" id="maxRadius" step="any" min="0.1" tabindex="6" />
								</div>
								<div class="field-row">
									<label>Recursion</label>
									<input type="number" id="recursionDepth" step="1" min="1" tabindex="7" />
								</div>
							</div>
						</div>
					</div>

					<!-- Palette -->
					<div class="section" data-section="palette">
						<div class="section-header" data-toggle>
							<span>Palette</span>
							<span class="chevron">▾</span>
						</div>
						<div class="section-body open">
							<div class="tab-bar" id="paletteTabs">
								<button class="tab-btn active" data-tab="offset">Offset</button>
								<button class="tab-btn" data-tab="stagger">Stagger</button>
								<button class="tab-btn" data-tab="period">Period</button>
							</div>

							<!-- Offset -->
							<div class="tab-pane active" id="tab-offset">
								<div class="slider-row"><label>Master</label><input type="range" step="0.01" min="-3.14159" max="3.14159" value="0" id="masterOffset" /><input type="text" class="slider-val" id="masterOffsetText" value="0" /></div>
								<div class="slider-row"><label>Red</label><input type="range" step="0.01" min="-3.14159" max="3.14159" value="0" id="redOffset" /><input type="text" class="slider-val" id="redOffsetText" value="0" /></div>
								<div class="slider-row"><label>Green</label><input type="range" step="0.01" min="-3.14159" max="3.14159" value="0" id="greenOffset" /><input type="text" class="slider-val" id="greenOffsetText" value="0" /></div>
								<div class="slider-row"><label>Blue</label><input type="range" step="0.01" min="-3.14159" max="3.14159" value="0" id="blueOffset" /><input type="text" class="slider-val" id="blueOffsetText" value="0" /></div>
							</div>

							<!-- Stagger + Bitmask -->
							<div class="tab-pane" id="tab-stagger">
								<div class="check-grid" style="margin-bottom: 0.3rem">
									<label class="check-group">
										<input type="checkbox" id="staggerBefore" checked />
										Before Mods
									</label>
									<label class="check-group">
										<input type="checkbox" id="staggerAfter" />
										After Mods
									</label>
								</div>
								<div class="slider-row"><label>Master</label><input type="range" step="0.01" min="-3.14159" max="3.14159" value="0" id="masterStagger" /><input type="text" class="slider-val" id="masterStaggerText" value="0" /></div>
								<div class="slider-row"><label>Red</label><input type="range" step="0.01" min="-3.14159" max="3.14159" value="0" id="redStagger" /><input type="text" class="slider-val" id="redStaggerText" value="0" /></div>
								<div class="slider-row"><label>Green</label><input type="range" step="0.01" min="-3.14159" max="3.14159" value="0" id="greenStagger" /><input type="text" class="slider-val" id="greenStaggerText" value="0" /></div>
								<div class="slider-row"><label>Blue</label><input type="range" step="0.01" min="-3.14159" max="3.14159" value="0" id="blueStagger" /><input type="text" class="slider-val" id="blueStaggerText" value="0" /></div>
								<div class="btn-block" style="margin-top:0.3rem;">
									<button class="btn" id="editBitmaskBtn">Edit Stagger Bitmask</button>
								</div>
							</div>

							<!-- Period + Wave Period -->
							<div class="tab-pane" id="tab-period">
								<div class="field-row">
									<label>Wave Period:</label>
									<input type="number" id="numcolours" step="any" value="64" />
									<input type="number" id="numcoloursDisplay" class="value-adjuster-display" step="any" />
								</div>
								<div class="field-row" style="border-top:1px solid rgba(0,0,0,0.04); padding-top:0.3rem;"><label>Multiplier:</label></div>
								<div class="slider-row"><label>Red</label><input type="number" id="redPeriod" step="any" value="1" /><input type="number" id="redPeriodText" class="value-adjuster-display" step="any" /></div>
								<div class="slider-row"><label>Green</label><input type="number" id="greenPeriod" step="any" value="1" /><input type="number" id="greenPeriodText" class="value-adjuster-display" step="any" /></div>
								<div class="slider-row"><label>Blue</label><input type="number" id="bluePeriod" step="any" value="1" /><input type="number" id="bluePeriodText" class="value-adjuster-display" step="any" /></div>
							</div>

							<!-- Live preview of the palette sine waves -->
							<div class="palette-graph" id="paletteGraph">
								<canvas id="paletteGraphCanvas"></canvas>
							</div>

						</div>
					</div>

				</div><!-- /sidebar-scroll -->
			</aside>

		</div><!-- /main -->

		<!-- Footer (thumbnails) -->
		<footer class="footer" id="footer">
			<div class="footer-tabs" id="footerTabs">
				<button class="tab-btn active" data-tab="saved">Saved</button>
				<button class="tab-btn" data-tab="examples">Examples</button>
			</div>
			<div class="thumb-strip" id="savedRenderings"></div>
			<div class="thumb-strip" id="demos" style="display:none;"></div>
		</footer>

	</div><!-- /app -->

	<!-- ====== POPUP ====== -->
	<div class="popup-overlay" id="popupOverlay">
		<div class="popup-box" id="popupBox">
			<div id="popupContent"></div>
			<div class="popup-actions" id="popupActions"></div>
		</div>
	</div>
</body>
</html>
